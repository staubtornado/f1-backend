openapi: 3.0.3
info:
  title: F1 Backend API
  version: 1.0.0
  description: API wrapper for OpenF1 session data.

paths:
  /sessions:
    get:
      summary: Get sessions
      description: Returns Formula 1 sessions from OpenF1. Optionally filtered by year.
      operationId: getSessions
      tags:
        - Sessions
      parameters:
        - name: year
          in: query
          required: false
          description: Season year (e.g. 2023)
          schema:
            type: integer
            example: 2023
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                type: array
              example:
                - circuit_key: 7
                  circuit_short_name: Spa-Francorchamps
                  country_code: BEL
                  country_key: 16
                  country_name: Belgium
                  date_end: "2023-07-29T15:35:00+00:00"
                  date_start: "2023-07-29T15:05:00+00:00"
                  gmt_offset: "02:00:00"
                  is_cancelled: false
                  location: Spa-Francorchamps
                  meeting_key: 1216
                  session_key: 9140
                  session_name: Sprint Qualifying
                  session_type: Sprint Qualifying
                  year: 2023
        "500":
          description: Internal server error